<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opatrip Trace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Styles are split by concern; see static/css/. Load order matters only in that
     base.css defines the design tokens every other file uses. -->
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/layout.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/loading.css">
</head>
<body>
<!-- Boot splash: trace, then capture, while an arc sweeps and the ring counts up.
     Deliberately inline in the HTML — it exists to cover the time the ES modules take to
     load, so it must be painted before any of them run. core.js drives it. -->
<div id="boot" role="status" aria-live="polite" aria-label="Loading Opatrip Trace">
  <div class="bootwrap">
    <div class="bootmark">
      <svg class="bootrings" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="trk" cx="100" cy="100" r="88"/>
        <!-- exact progress, so the ring is a readout and not just decoration -->
        <circle class="prog" cx="100" cy="100" r="88"/>
        <!-- still-working sweep, on its own orbit outside the readout -->
        <circle class="arc" cx="100" cy="100" r="96"/>
        <!-- three markers making the rounds, at speeds that never resynchronise -->
        <g class="sat s1"><circle cx="100" cy="12" r="3.2"/></g>
        <g class="sat s2"><circle cx="100" cy="12" r="2.4"/></g>
        <g class="sat s3"><circle cx="100" cy="4" r="1.8"/></g>
      </svg>
      <svg class="bootlogo" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <mask id="bootWaveB" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64">
            <g class="wavebody back"><path class="waveb" fill="#fff" d="M0 9 q9 -1.8 18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 V80 H-4 Z"/></g>
          </mask>
          <mask id="bootWave" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64">
            <g class="wavebody"><path class="wave" fill="#fff" d="M0 8 q6 -2.6 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 V80 H-4 Z"/></g>
          </mask>
        </defs>
        <g class="ghost">
          <path class="lg-ring" d="M7 24 A17 17 0 0 1 24 7 A17 17 0 0 1 41 24 A17 17 0 0 1 24 41 L7 41 Z"/>
          <circle class="lg-dot" cx="24" cy="24" r="5.2"/>
        </g>
        <g class="trace">
          <path class="lg-ring" id="bootTrace" d="M7 24 A17 17 0 0 1 24 7 A17 17 0 0 1 41 24 A17 17 0 0 1 24 41 L7 41 Z"/>
        </g>
        <g class="liquid back" mask="url(#bootWaveB)">
          <path class="lg-ring" d="M7 24 A17 17 0 0 1 24 7 A17 17 0 0 1 41 24 A17 17 0 0 1 24 41 L7 41 Z"/>
          <circle class="lg-dot" cx="24" cy="24" r="5.2"/>
        </g>
        <g class="liquid" mask="url(#bootWave)">
          <path class="lg-ring" d="M7 24 A17 17 0 0 1 24 7 A17 17 0 0 1 41 24 A17 17 0 0 1 24 41 L7 41 Z"/>
          <circle class="lg-dot" cx="24" cy="24" r="5.2"/>
        </g>
        <g class="gloss">
          <path class="lg-ring" d="M7 24 A17 17 0 0 1 24 7 A17 17 0 0 1 41 24 A17 17 0 0 1 24 41 L7 41 Z"/>
          <circle class="lg-dot" cx="24" cy="24" r="5.2"/>
        </g>
      </svg>
    </div>
    <div class="bootword"><b>OPATRIP</b> TRACE</div>
    <div class="bootstage" id="bootStage">Starting up</div>
  </div>
</div>

<div class="app">
<aside>
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M7 24 A17 17 0 0 1 24 7 A17 17 0 0 1 41 24 A17 17 0 0 1 24 41 L7 41 Z" stroke="#AD68E2" stroke-width="7" stroke-linejoin="round"/><circle cx="24" cy="24" r="5.2" fill="#AD68E2"/></svg></div>
    <div><b>OPATRIP</b><span>Product audit</span></div>
  </div>
  <nav id="tabs">
    <div class="navgrp">Overview</div>
    <button class="navbtn" data-t="stats" aria-selected="true"><span class="ico">▦</span>Dashboard</button>
    <button class="navbtn" data-t="products" aria-selected="false"><span class="ico">◧</span>Products<span class="cnt" id="cntProducts">–</span></button>
    <button class="navbtn" data-t="accounts" aria-selected="false"><span class="ico">⌂</span>Accounts<span class="cnt" id="cntAccounts">–</span></button>
    <div class="navgrp">Traceability</div>
    <button class="navbtn" data-t="syncs" aria-selected="false"><span class="ico">⎘</span>Sync runs</button>
    <div class="navgrp">Insights</div>
    <button class="navbtn" data-t="categories" aria-selected="false"><span class="ico">◱</span>Breakdown</button>
    <div class="navgrp hidden" data-admin-only>Manage</div>
    <button class="navbtn hidden" data-admin-only data-t="admin" aria-selected="false"><span class="ico">☗</span>Admin</button>
  </nav>
  <!-- The Storage box was removed. It carried the margin-top:auto that pushes this
       footer to the bottom of the sidebar, so that moved here. -->
  <div class="whoami" style="margin-top:auto">
    <div class="av" id="meAv">?</div>
    <div style="min-width:0">
      <div style="font-weight:600;font-size:13.5px" id="meName">Not signed in</div>
      <div class="hint" id="meRole">open a browser to begin</div>
    </div>
  </div>
</aside>

<div>
<div class="topbar">
  <div>
    <h1 id="pageTitle">Dashboard</h1>
    <div class="crumb" id="pageCrumb">All accounts</div>
  </div>
  <div class="grow"></div>
  <select id="acct" title="Show data for" style="max-width:280px"></select>
  <button class="btn" id="btnFetch" disabled>Fetch</button>
  <button class="btn ghost" id="btnStop">Stop</button>
  <button class="btn primary" id="btnAdd">+ Add Account</button>
</div>

<main>
  <div id="sessions"></div>
  <div id="filterbar"></div>
  <div id="banner" class="banner hidden" style="margin-bottom:18px"></div>

  <div id="syncprogress"></div>

  <section id="v-stats"></section>
  <section id="v-accounts" class="hidden"></section>
  <section id="v-products" class="hidden"></section>
  <section id="v-categories" class="hidden"></section>
  <section id="v-syncs" class="hidden"></section>
  <section id="v-admin" class="hidden"></section>
</main>
</div>
</div>

<!-- Covers everything until someone signs in. -->
<div id="authHost"></div>
<div id="loadbar"></div>
<div id="loadchip" class="loadchip hidden"></div>
<div id="drawerHost"></div>
<div id="modalHost"></div>
<template id="tplAdd">
  <div class="scrim"></div>
  <div class="modal card">
    <h2 style="font-size:18px;margin-bottom:5px">Add account &amp; sign in</h2>
    <p class="hint" style="margin:0 0 18px">
      <b>Open browser</b> launches a Viator window. Sign in there by hand (including any
      2FA), then come back and press <b>Fetch</b>.
    </p>
    <label class="fl">Email you'll sign in with
      <input type="email" id="mEmail" placeholder="you@gmail.com" autocomplete="email">
      <span class="hint">Recorded against every change found, so you can see who ran what.</span>
    </label>
    <label class="fl">Viator account
      <select id="mAcct"></select>
      <span class="hint">Leave as “New account” — the account is detected after you sign in.</span>
    </label>
    <div id="mErr" class="banner hidden" style="margin-bottom:14px"></div>
    <div style="display:flex;gap:9px;justify-content:flex-end">
      <button class="btn ghost" id="mCancel">Cancel</button>
      <button class="btn primary" id="mGo">Open browser</button>
    </div>
  </div>
</template>

<!-- One entry point. app.js imports the rest, so adding a view means adding a file
     under static/js/views/ and registering it in app.js — nothing here changes. -->
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
